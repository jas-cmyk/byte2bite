<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home - Byte2Bite</title>
  <link rel="icon" type="image/png" href="assets/samgyuplogo.png" />
  <link rel="stylesheet" href="main.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner">
      <!-- Brand -->
      <a class="brand" href="./" aria-label="byte2bite home">
        <span class="brand__name">BYTE<span class="brand__accent">2</span>BITE</span>
      </a>

      <!-- Actions -->
      <div class="actions">
        <button class="btn btn--ghost" type="button">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="7.5" r="3.75" /><path d="M4.5 21a7.5 7.5 0 0 1 15 0" /></svg>
          Sign in
        </button>
        <button class="menu-toggle" type="button" aria-label="Toggle menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <!-- Navigation: left sidebar on desktop, dropdown on mobile -->
  <aside class="sidebar" id="sidebar">
    <nav class="nav" aria-label="Primary">
      <a class="nav__link nav__link--active" href="#">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5" /><path d="M5 9.5V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9.5" /><path d="M9.5 21v-6h5v6" /></svg>
        HOME
      </a>
      <a class="nav__link" href="reservation/">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16.5" rx="2" /><path d="M3 9.5h18" /><path d="M8 3v3" /><path d="M16 3v3" /></svg>
        RESERVATION
      </a>
      <a class="nav__link" href="contact/">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="4.5" width="19" height="15" rx="2" /><path d="m3 6.5 9 6 9-6" /></svg>
        CONTACT
      </a>
      <a class="nav__link" href="about/">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5" /><path d="M12 11v5.5" /><path d="M12 7.5h.01" /></svg>
        ABOUT US
      </a>
    </nav>
    <img src="assets/samgyuplogo.png" alt="byte2bite logo" width="148" height="148">
  </aside>

  <main class="page">
    <!-- Hero carousel -->
    <section class="hero" data-carousel aria-roledescription="carousel" aria-label="Featured dishes">
      <div class="hero__viewport" aria-live="polite">
        <!-- Slides are rendered from lib/seed.js by main.js -->
        <ul class="hero__track"></ul>
      </div>

      <button class="hero__nav hero__nav--prev" type="button" aria-label="Previous slide">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6" /></svg>
      </button>
      <button class="hero__nav hero__nav--next" type="button" aria-label="Next slide">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6" /></svg>
      </button>

      <div class="hero__dots" role="tablist" aria-label="Choose slide"></div>
    </section>

    <h1 class="page__title">What are you craving?</h1>
    <p class="page__subtitle">Fresh food from local kitchens, delivered fast.</p>

    <!-- Drinks: rendered from lib/seed.js by main.js -->
    <section class="drinks" aria-labelledby="drinks-title">
      <h2 class="section__title section__title--icon" id="drinks-title">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4h12l-1.3 15.1a2 2 0 0 1-2 1.9H9.3a2 2 0 0 1-2-1.9Z" /><path d="M6.7 9.5h10.6" /></svg>
        Drinks
      </h2>
      <div class="drinks__grid" data-drinks></div>
    </section>

    <!-- Offers: moved here from the former offers page; rendered from lib/seed.js by main.js -->
    <section class="offers" aria-labelledby="offers-title">
      <h2 class="section__title section__title--icon" id="offers-title">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.59 13.41 13.42 20.58a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82Z" /><circle cx="7" cy="7" r="1.25" /></svg>
        Offers
      </h2>
      <div class="offers__grid" data-offers data-base=""></div>
    </section>
  </main>

  <script src="lib/seed.js"></script>
  <script src="main.js"></script>
</body>
</html>
