<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offers - byte2bite</title>
  <link rel="stylesheet" href="../main.css">
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner">
      <!-- Brand -->
      <a class="brand" href="../" aria-label="byte2bite home">
        <span class="brand__name">BYTE<span class="brand__accent">2</span>BITE</span>
      </a>

      <!-- Actions -->
      <div class="actions">
        <button class="btn btn--ghost" type="button">Sign in</button>
        <button class="menu-toggle" type="button" aria-label="Toggle menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <!-- Navigation: left sidebar on desktop, dropdown on mobile -->
  <aside class="sidebar" id="sidebar">
    <nav class="nav" aria-label="Primary">
      <a class="nav__link" href="../">HOME</a>
      <a class="nav__link" href="../reservation/">RESERVATION</a>
      <a class="nav__link nav__link--active" href="#">OFFERS</a>
      <a class="nav__link" href="../contact/">CONTACT</a>
      <a class="nav__link" href="#">ABOUT US</a>
    </nav>
    <img src="../assets/samgyuplogo.png" alt="byte2bite logo" width="148" height="148">
  </aside>

  <main class="page">
    <h1 class="page__title">OFFERS</h1>
    <p class="page__subtitle">Deals, bundles and limited-time specials.</p>

    <!-- Offers: rendered from lib/seed.js by main.js -->
    <section class="offers" aria-label="Current offers">
      <div class="offers__grid" data-offers data-base="../"></div>
    </section>
  </main>

  <script src="../lib/seed.js"></script>
  <script src="../main.js"></script>
</body>
</html>
